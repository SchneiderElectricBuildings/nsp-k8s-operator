apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nsp-k8s-operator-helm.fullname" . }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "nsp-k8s-operator-helm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "nsp-k8s-operator-helm.fullname" . }}
  apiGroup: rbac.authorization.k8s.io