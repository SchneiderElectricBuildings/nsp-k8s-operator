{{- $path := .Values.configPath | default "/app/config/config.yaml" -}}
{{- $dir  := dir $path -}}   # gives /app/config
{{- $file := base $path -}}  # gives config.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nsp-k8s-operator-helm.fullname" . }}
  labels:
    {{- include "nsp-k8s-operator-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nsp-k8s-operator-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.podAnnotations }}
        {{ toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nsp-k8s-operator-helm.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{ toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nsp-k8s-operator-helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "nsp-k8s-operator-helm.fullname" . }}-config
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}nsp-k8s-operator:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.logLevel }}
            - name: CONFIG_PATH
              value: {{ $path | quote }}
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            {{- end }}
            - name: NO_PROXY
              value: "localhost,127.0.0.0/8,10.0.0.0/8,192.168.0.0/16,cluster.local,.cluster.local,svc.cluster.local,.svc.cluster.local"
          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path | default "/livez" | quote }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds | default 5 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path | default "/readyz" | quote }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds | default 5 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: app-config
              mountPath: {{ $dir | quote }}
              readOnly: true 
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew | default 1 }}
          topologyKey: {{ .topologyKey | default "kubernetes.io/hostname" | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "nsp-k8s-operator-helm.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
